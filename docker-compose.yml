services:
  mongodb:
    image: mongo:7.0
    container_name: devpilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - devpilot-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=devra
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - devpilot-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: devpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devpilot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - devpilot-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devpilot-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/devra
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_STORE=redis
      - CLIENT_URL=http://localhost:80
      - JWT_SECRET=${JWT_SECRET:-devpilot_production_jwt_secret_32chars_key!}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-devra_webhook_secret_default_2026}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devpilot-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: devpilot-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - devpilot-network

volumes:
  devpilot-data:
    driver: local
  devpilot-redis-data:
    driver: local

networks:
  devpilot-network:
    driver: bridge
