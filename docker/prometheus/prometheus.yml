global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "devra-server"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["devra-server:5000", "localhost:5000"]
        labels:
          service: "devra-server"
          env: "production"
