services:
  - type: web
    name: devra-server
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: VECTOR_STORE
        value: redis
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false

